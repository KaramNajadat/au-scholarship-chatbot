name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      # Imports every module in dependency order: app -> rag -> index -> db.
      # This catches syntax errors, undefined names at module scope, circular
      # imports and a broken requirements.txt. It works because the Chroma
      # client is created on first query rather than at import, so no vector
      # index needs to exist here. See docs/engineering-notes.md.
      - name: Import smoke test
        run: python -c "import src.app; print('imported OK')"
